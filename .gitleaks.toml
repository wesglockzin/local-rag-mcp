title = "local-rag-mcp rules"

[extend]
useDefault = true

[allowlist]
description = "Plainly fake password in an earlier commit of the test file"
regexes = ['''test-pw-not-real''']

[[rules]]
id = "internal-hostname"
description = "Internal hostname suffix"
regex = '''(?i)\b[a-z0-9-]+(\.[a-z0-9-]+)*\.(internal|corp|intranet|lan)\b'''
keywords = [".internal", ".corp", ".intranet", ".lan"]

[[rules]]
id = "private-ip-address"
description = "Private IPv4 address"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "192.168.", "172."]
