name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]" uv pip-audit deptry
      - name: lockfile is current
        run: uv lock --check
      - name: lint
        run: |
          ruff check .
          ruff format --check .
          deptry .
      - name: sample corpus is in sync with its generator
        run: |
          python tools/gen_sample_corpus.py
          git diff --exit-code -- sample-corpus
      - name: tests (embedder stubbed — no Ollama in CI; real chromadb + mcp installed)
        run: python -m pytest -q
      - name: dependency audit
        run: pip-audit .
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
