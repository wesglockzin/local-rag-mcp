name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e ".[dev]" uv pip-audit deptry
      - name: lockfile is current
        run: uv lock --check
      - name: lint
        run: |
          ruff check .
          ruff format --check .
          deptry .
      - name: sample corpus is in sync with its generator
        run: |
          python tools/gen_sample_corpus.py
          git diff --exit-code -- sample-corpus
      - name: tests (embedder stubbed — no Ollama in CI; real chromadb + mcp installed)
        run: python -m pytest -q
      - name: dependency audit
        # These four chromadb advisories have no fixed release as of 2026-11-13.
        # They affect the chroma server, auth and tenant features, none of which
        # this project uses: it uses only the embedded PersistentClient with
        # explicit embeddings. Remove each ID once chromadb ships a fix.
        run: >-
          pip-audit .
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
