[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-mcp"
version = "1.0.0"
description = "Read-only MCP server for semantic search over a local document corpus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "chromadb>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8",
]

[project.scripts]
local-rag-server = "server:main"
local-rag-ingest = "ingest:main"

[tool.setuptools]
py-modules = ["common", "ingest", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "S110", "S112", "T20"]

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]
